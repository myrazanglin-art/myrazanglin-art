name: Generate Tech Chips

on:
  workflow_dispatch: 
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run script
        run: python scripts/gen_chips.py
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add chips/ README.md
          git commit -m "generate chips" || echo "No changes"
          git push
